name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build web UI
        run: bun run --filter '@orbit/app' build

      - name: Workflow files parse
        run: bun run --filter '@orbit/e2e' check:workflows

      - name: Install Playwright Chromium
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium

      - name: Web e2e (Playwright)
        run: bun run --filter '@orbit/e2e' test:web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 14

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bun-target: bun-windows-x64
            exe: .exe
            smoke: true
          - os: ubuntu-22.04
            bun-target: bun-linux-x64
            exe: ""
            smoke: true
          # tauri-driver has no macOS driver: macOS gets a build + artifact only.
          - os: macos-latest
            bun-target: bun-darwin-arm64
            exe: ""
            smoke: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/orbit/src-tauri -> target

      - name: Linux system dependencies (Tauri 2 + WebDriver)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Orion sidecar
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host triple: $TRIPLE"
          mkdir -p apps/orbit/src-tauri/binaries
          bun build --compile --target=${{ matrix.bun-target }} packages/orion/src/main.ts \
            --outfile "apps/orbit/src-tauri/binaries/orion-$TRIPLE${{ matrix.exe }}"
          ls -la apps/orbit/src-tauri/binaries

      - name: Smoke-test compiled Orion sidecar
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          DATA_DIR="$(mktemp -d)"
          LOG="$RUNNER_TEMP/orion-smoke.log"
          "apps/orbit/src-tauri/binaries/orion-$TRIPLE${{ matrix.exe }}" \
            --port 0 --token ci-smoke --mock-model --seed --data-dir "$DATA_DIR" \
            > "$LOG" 2>&1 &
          PID=$!
          READY=0
          for _ in $(seq 1 60); do
            if grep -q '^ORION_READY' "$LOG"; then READY=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          cat "$LOG"
          if [ "$READY" != 1 ]; then echo "ORION_READY not printed by the compiled sidecar"; exit 1; fi
          test -f "$DATA_DIR/resources/AGENTS.md"
          test -f "$DATA_DIR/resources/skills/herd-data/SKILL.md"
          test -f "$DATA_DIR/resources/connector-template/index.ts"

      - name: Build desktop app (debug, unsigned)
        working-directory: apps/orbit
        run: bunx tauri build --debug

      - name: Upload installers and binaries
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-${{ matrix.os }}
          path: |
            apps/orbit/src-tauri/target/debug/bundle/
            apps/orbit/src-tauri/target/debug/orbit-desktop${{ matrix.exe }}
            apps/orbit/src-tauri/target/debug/orion${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14

      - name: Install tauri-driver
        if: matrix.smoke
        run: cargo install tauri-driver --locked

      - name: msedgedriver matching Edge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wvKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $wvKey) {
            $version = (Get-ItemProperty $wvKey).pv
          } else {
            $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            $version = (Get-Item $edge).VersionInfo.ProductVersion
          }
          Write-Host "WebView2 / Edge version: $version"
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\driver.zip"
            Expand-Archive "$dir\driver.zip" -DestinationPath $dir -Force
            $driver = Join-Path $dir "msedgedriver.exe"
          } catch {
            Write-Host "Download failed ($_); falling back to the runner image's EdgeWebDriver"
            $driver = Join-Path $env:EDGEWEBDRIVER "msedgedriver.exe"
          }
          & $driver --version
          "TAURI_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Desktop smoke (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $gsudoZip = Join-Path $env:RUNNER_TEMP "gsudo.zip"
          $gsudoDir = Join-Path $env:RUNNER_TEMP "gsudo"
          Invoke-WebRequest "https://github.com/gerardog/gsudo/releases/latest/download/gsudo.portable.zip" -OutFile $gsudoZip
          Expand-Archive $gsudoZip -DestinationPath $gsudoDir -Force
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\no.agrointel.orbit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\no.agrointel.orbit" | Out-Null
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" /Q | Out-Null
          icacls "$env:GITHUB_WORKSPACE\packages\e2e" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "$env:APPDATA\no.agrointel.orbit" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "$env:LOCALAPPDATA\no.agrointel.orbit" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "$env:RUNNER_TEMP" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          icacls "$env:TEMP" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          & "$gsudoDir\x64\gsudo.exe" --integrity Medium bun run --filter '@orbit/e2e' test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Desktop smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a bun run --filter '@orbit/e2e' test:desktop
