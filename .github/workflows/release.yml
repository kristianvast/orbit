name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            exe: .exe
          - name: linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            exe: ""
          - name: linux-arm64
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bun-target: bun-linux-arm64
            exe: ""
            # linuxdeploy cannot build an AppImage on the ARM runner, so ARM Linux ships a .deb.
            bundles: --bundles deb
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            exe: ""
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            exe: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Optional Windows code signing via Azure Trusted Signing; skipped when unset.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/orbit/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Orion sidecar
        run: |
          mkdir -p apps/orbit/src-tauri/binaries
          bun build --compile --minify --keep-names --target=${{ matrix.bun-target }} \
            packages/orion/src/main.ts \
            --outfile "apps/orbit/src-tauri/binaries/orion-${{ matrix.rust-target }}${{ matrix.exe }}"

      - name: Download go2rtc sidecar (v1.9.15)
        run: |
          TRIPLE="${{ matrix.rust-target }}"
          case "$TRIPLE" in
            x86_64-pc-windows-msvc) ASSET=go2rtc_win64.zip ;;
            x86_64-unknown-linux-gnu) ASSET=go2rtc_linux_amd64 ;;
            aarch64-unknown-linux-gnu) ASSET=go2rtc_linux_arm64 ;;
            aarch64-apple-darwin) ASSET=go2rtc_mac_arm64.zip ;;
            x86_64-apple-darwin) ASSET=go2rtc_mac_amd64.zip ;;
            *) echo "Unsupported go2rtc target: $TRIPLE"; exit 1 ;;
          esac
          DEST="apps/orbit/src-tauri/binaries/go2rtc-$TRIPLE${{ matrix.exe }}"
          DOWNLOAD_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 \
            "https://github.com/AlexxIT/go2rtc/releases/download/v1.9.15/$ASSET" \
            --output "$DOWNLOAD_DIR/$ASSET"
          if [[ "$ASSET" == *.zip ]]; then
            unzip -q "$DOWNLOAD_DIR/$ASSET" -d "$DOWNLOAD_DIR/unpacked"
            cp "$DOWNLOAD_DIR/unpacked/go2rtc${{ matrix.exe }}" "$DEST"
          else
            cp "$DOWNLOAD_DIR/$ASSET" "$DEST"
          fi
          chmod +x "$DEST"
          rm -rf "$DOWNLOAD_DIR"

      - name: Bundle git and a shell for Windows (MinGit)
        if: runner.os == 'Windows'
        run: scripts/fetch-mingit.sh

      - name: Install Azure Trusted Signing CLI
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli --locked

      # Empty values would make Tauri try to sign with nothing, so these are exported only when set.
      - name: Optional macOS signing and cloud address
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ORBIT_DEFAULT_CORE_URL: ${{ vars.ORBIT_CORE_URL }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_CERTIFICATE" ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "::warning::No Apple signing secrets: this macOS build is unsigned and Gatekeeper will block it after download."
          fi
          if [[ -n "$ORBIT_DEFAULT_CORE_URL" ]]; then
            echo "ORBIT_DEFAULT_CORE_URL=$ORBIT_DEFAULT_CORE_URL" >> "$GITHUB_ENV"
          fi

      - name: Release config override
        run: |
          bun -e '
            const env = process.env;
            const conf = { bundle: { createUpdaterArtifacts: true } };
            if (env.TAURI_UPDATER_PUBKEY) conf.plugins = { updater: { pubkey: env.TAURI_UPDATER_PUBKEY } };
            if (process.platform === "win32" && env.AZURE_CLIENT_ID) {
              conf.bundle.windows = {
                signCommand: "trusted-signing-cli -e " + env.AZURE_TRUSTED_SIGNING_ENDPOINT +
                  " -a " + env.AZURE_TRUSTED_SIGNING_ACCOUNT +
                  " -c " + env.AZURE_TRUSTED_SIGNING_PROFILE + " -d Orbit %1",
              };
            }
            await Bun.write(env.RUNNER_TEMP + "/tauri.release.conf.json", JSON.stringify(conf, null, 2));
            console.log(JSON.stringify(conf, null, 2));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/orbit
          tauriScript: bunx tauri
          args: --target ${{ matrix.rust-target }} --config ${{ runner.temp }}/tauri.release.conf.json ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Orbit ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          # The publish job writes latest.json once; parallel builds rewriting it lose entries.
          includeUpdaterJson: false

  # Gives each installer a name that never changes, so the website can link straight to
  # releases/latest/download/<name>, then publishes the draft so the updater feed goes live.
  publish:
    name: publish
    needs: build
    # Runs even when one platform failed: farmers on the others should still get their installer.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add stable download names and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-setup.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb' \
            --pattern '*.sig'
          bun ../scripts/release-latest-json.ts . "$TAG" "$GITHUB_REPOSITORY"
          named=()
          stable() {
            local found=( $1 )
            if [[ ! -f "${found[0]}" ]]; then
              echo "::warning::no installer matches $1, so $2 is not in this release"
              return
            fi
            cp "${found[0]}" "$2"
            named+=( "$2" )
          }
          stable '*_x64-setup.exe' Orbit-Windows.exe
          stable '*_aarch64.dmg' Orbit-macOS-Apple-Silicon.dmg
          stable '*_x64.dmg' Orbit-macOS-Intel.dmg
          stable '*_amd64.AppImage' Orbit-Linux-x64.AppImage
          stable '*_arm64.deb' Orbit-Linux-arm64.deb
          # Windows is where most farm PCs are: never publish a release without it.
          if [[ ! -f Orbit-Windows.exe ]]; then echo "no Windows installer; leaving the release as a draft"; exit 1; fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest.json "${named[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
