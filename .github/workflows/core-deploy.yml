name: Core deploy

# Staging deploys on every push to main that touches Core. Production is manual
# (workflow_dispatch) and gated by the `production` GitHub Environment's required reviewers.
# Infrastructure, env vars and secrets are owned by core/deploy/provision.sh; this workflow
# only ships a new image.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "packages/schema/**"
      - ".github/workflows/core-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: core-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --filter '@core/api' typecheck
      - name: Test
        run: bun run --filter '@core/api' test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Image name
        id: image
        run: |
          tag="${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$REGION-docker.pkg.dev/$PROJECT/orbit-core/core-api:$tag" >> "$GITHUB_OUTPUT"

      - name: Docker auth
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          gcloud run deploy "orbit-core-$TARGET" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --update-env-vars "CORE_VERSION=$TAG" --quiet
          url="$(gcloud run services describe "orbit-core-$TARGET" --project "$PROJECT" \
            --region "$REGION" --format 'value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Cloud Run's front end reserves paths ending in "z" on run.app, so /healthz never reaches
      # the container; /health is the same handler.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
