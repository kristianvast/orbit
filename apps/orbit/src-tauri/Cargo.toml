[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit desktop app for livestock and farm intelligence with the Orion AI agent"
authors = ["AgroIntel <kristian@agrointel.no>"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
